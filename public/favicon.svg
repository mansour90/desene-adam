<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background icon container -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  
  <!-- Drawing sheet -->
  <g filter="url(#shadow)">
    <rect x="18" y="16" width="56" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Doodle on sheet -->
    <path d="M 32 46 Q 46 28 60 46" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    <circle cx="46" cy="58" r="8" fill="none" stroke="#f59e0b" stroke-width="3" />
    <path d="M 28 70 L 64 70" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Big smiling pencil -->
  <g transform="translate(62, 54) rotate(-35)" filter="url(#shadow)">
    <!-- Eraser -->
    <rect x="-8" y="-36" width="16" height="10" rx="3" fill="#f472b6" />
    <rect x="-8" y="-28" width="16" height="5" fill="#cbd5e1" />
    <!-- Body -->
    <rect x="-8" y="-24" width="16" height="34" rx="2" fill="#fbbf24" />
    <line x1="-2" y1="-24" x2="-2" y2="10" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="2" y1="-24" x2="2" y2="10" stroke="#fef08a" stroke-width="1.5" />
    <!-- Wood tip -->
    <polygon points="-8,10 8,10 0,22" fill="#fed7aa" />
    <!-- Graphite lead -->
    <polygon points="-3,17 3,17 0,22" fill="#0284c7" />
  </g>
</svg>
